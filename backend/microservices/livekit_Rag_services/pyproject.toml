[project]
name = "livekit-rag-services"
version = "0.1.0"
description = "LiveKit RAG Services"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Muhammad Saqib", email = "saqibmaqsood441@example.com" }
]
dependencies = [
    "aio-pika>=9.0.0",
    "alembic",
    "asyncpg",
    "beautifulsoup4>=4.15.0",
    "email-validator>=2.3.0",
    "fastapi",
    "faster-whisper>=1.2.1",
    "groq>=1.6.0",
    "huggingface-hub>=1.27.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-pinecone",
    "librosa>=1.0.0",
    "livekit>=1.1.14",
    "livekit-api>=1.2.0",
    "phonenumbers>=9.0.37",
    "pinecone>=6.0.0,<8.0.0",
    "piper-tts>=1.7.0",
    "pwdlib>=0.3.1",
    "pydantic-settings",
    "pydantic[email]>=2.13.4",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "selenium>=4.46.0",
    "sentence-transformers>=5.7.0",
    "setuptools<81",
    "sqlalchemy",
    "uvicorn",
    "webdriver-manager>=4.1.2",
    "webrtcvad>=2.0.10",
]


[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
